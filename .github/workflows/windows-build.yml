name: Windows build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure 2>&1 | Tee-Object -FilePath ctest.log
          $code = $LASTEXITCODE
          # Diagnostics: run every test directly and keep its own report file.
          Get-ChildItem build/tests/tst_*.exe | ForEach-Object {
            & $_.FullName -o "$($_.BaseName).txt,txt" 2>&1 | Out-Null
            "$($_.BaseName) exit code: $LASTEXITCODE" | Add-Content ctest.log
          }
          exit $code

      - name: Publish test log (diagnostics)
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git"
          New-Item -ItemType Directory logs-repo | Out-Null
          Set-Location logs-repo
          git init -q
          git remote add origin $repo
          git ls-remote --exit-code --heads origin ci-logs | Out-Null
          if ($LASTEXITCODE -eq 0) { git fetch -q --depth 1 origin ci-logs; git checkout -q -B ci-logs FETCH_HEAD } else { git checkout -q --orphan ci-logs }
          Copy-Item ../ctest.log "ctest-$($env:GITHUB_RUN_NUMBER).log" -ErrorAction SilentlyContinue
          Get-ChildItem ../tst_*.txt -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "run$($env:GITHUB_RUN_NUMBER)-$($_.Name)" }
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "ctest log run $($env:GITHUB_RUN_NUMBER)"
          git push -q origin ci-logs

      - name: Deploy Qt runtime
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/PawIDE.exe dist/
          windeployqt --release --no-translations dist/PawIDE.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          $version = "0.0.0-dev"
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME.TrimStart("v") }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path dist).Path)" installer\PawIDE.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "installer\Output\PawIDE-Setup-x64.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PawIDE-Setup-x64.exe" | Set-Content -Encoding ascii "installer\Output\PawIDE-Setup-x64.exe.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PawIDE-windows-x64
          path: installer/Output/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/PawIDE-Setup-x64.exe
            installer/Output/PawIDE-Setup-x64.exe.sha256
          body_path: RELEASE_NOTES.md
